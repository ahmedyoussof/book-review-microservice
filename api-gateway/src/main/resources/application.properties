server.port=8080
spring.application.name=api-gateway
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.routes[0].id=route_catalog
spring.cloud.gateway.routes[0].uri=lb://book-catalog-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/catalog/**

spring.cloud.gateway.routes[1].id=route_book_info
spring.cloud.gateway.routes[1].uri=lb://book-info-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/books/**

spring.cloud.gateway.routes[2].id=route_rating-data
spring.cloud.gateway.routes[2].uri=lb://ratings-data-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/ratings/**

spring.cloud.gateway.routes[4].id=route_user
spring.cloud.gateway.routes[4].uri=lb://user-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/users/**
spring.cloud.gateway.routes[4].predicates[1]=Method=POST

spring.cloud.gateway.routes[3].id=route_user
spring.cloud.gateway.routes[3].uri=lb://user-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/users/**
spring.cloud.gateway.routes[3].predicates[1]=Method=GET
spring.cloud.gateway.routes[3].filters[0]=AuthorizationHeaderFilter



