server.port=8080
spring.application.name=api-gateway
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.routes[0].id=route_catalog
spring.cloud.gateway.routes[0].uri=lb://book-catalog-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/catalog/**

spring.cloud.gateway.routes[1].id=route_book_info
spring.cloud.gateway.routes[1].uri=lb://book-info-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/books/**

spring.cloud.gateway.routes[2].id=route_rating-data
spring.cloud.gateway.routes[2].uri=lb://ratings-data-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/ratings/**

